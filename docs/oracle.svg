<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d">
  <title id="t">The three-way oracle</title>
  <desc id="d">One corpus of 126 expressions is put to JavaRosa, to Enketo's evaluator, and to rxeval. The two references agree on 99 of them and disagree with each other on 26; each disagreement is recorded in the test suite with the side rxeval follows and the reason.</desc>
  <style>
    .bg { fill: #faf6ee; }
    .card { fill: #fffdf8; stroke: #e3dbc9; }
    .t { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; fill: #1b2a41; }
    .m { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .display { font-family: Fraunces, Georgia, serif; font-weight: 600; }
    .muted { fill: #46587a; }
    .accent { fill: #3b6ea5; }
    .warn { fill: #a86f1f; }
    .ok { fill: #2f7d49; }
    .rule { stroke: #e3dbc9; }
    .flow { stroke: #46587a; fill: none; stroke-width: 1.4; }
    .agree { stroke: #2f7d49; fill: none; stroke-width: 2; }
    .split { stroke: #a86f1f; fill: none; stroke-width: 2; stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #10141d; }
      .card { fill: #161c28; stroke: #2a3347; }
      .core { fill: #161c28; stroke: #82b3e8; }
      .t { fill: #e6ecf5; }
      .muted { fill: #9fadc4; }
      .accent { fill: #82b3e8; }
      .warn { fill: #d3a04c; }
      .ok { fill: #5fc26a; }
      .rule { stroke: #2a3347; }
      .flow { stroke: #9fadc4; }
      .flow-accent { stroke: #82b3e8; }
      .agree { stroke: #5fc26a; }
      .split { stroke: #d3a04c; }
    }
  </style>
  <rect class="bg" width="880" height="430" />

  <!-- the corpus -->
  <g class="t">
    <rect class="card" x="24" y="150" width="168" height="76" rx="12" />
    <text class="display" x="108" y="180" font-size="17" text-anchor="middle">corpus</text>
    <text class="m muted" x="108" y="202" font-size="12" text-anchor="middle">126 expressions</text>
    <text class="m muted" x="108" y="218" font-size="10.5" text-anchor="middle">one shared instance</text>
  </g>

  <path class="flow" d="M192 172 C 232 172, 236 82, 276 82" />
  <path class="flow" d="M192 188 C 232 188, 236 188, 276 188" />
  <path class="flow" d="M192 204 C 232 204, 236 294, 276 294" />

  <!-- the three engines -->
  <g class="t">
    <rect class="card" x="276" y="54" width="228" height="60" rx="10" />
    <text x="296" y="79" font-size="14" font-weight="600">JavaRosa 5.1.0</text>
    <text class="muted" x="296" y="98" font-size="11.5">inside ODK Collect and KoboCollect</text>

    <rect class="card" x="276" y="160" width="228" height="60" rx="10" />
    <text x="296" y="185" font-size="14" font-weight="600">openrosa-xpath-evaluator</text>
    <text class="muted" x="296" y="204" font-size="11.5">inside Enketo web forms</text>

    <rect class="card" x="276" y="266" width="228" height="60" rx="10" />
    <text class="accent" x="296" y="291" font-size="14" font-weight="600">rxeval</text>
    <text class="muted" x="296" y="310" font-size="11.5">this crate</text>
  </g>

  <path class="flow" d="M504 84 C 540 84, 544 174, 580 174" />
  <path class="flow" d="M504 190 C 540 190, 544 182, 580 182" />
  <path class="flow" d="M504 296 C 540 296, 544 190, 580 190" />

  <!-- comparison -->
  <g class="t">
    <rect class="card" x="580" y="140" width="86" height="86" rx="43" />
    <text class="display" x="623" y="178" font-size="14" text-anchor="middle">compare</text>
    <text class="m muted" x="623" y="197" font-size="10" text-anchor="middle">value by</text>
    <text class="m muted" x="623" y="209" font-size="10" text-anchor="middle">value</text>
  </g>

  <path class="agree" d="M666 166 C 700 166, 704 96, 738 96" />
  <path class="split" d="M666 200 C 700 200, 704 272, 738 272" />

  <!-- outcomes -->
  <g class="t">
    <rect class="card" x="738" y="62" width="118" height="70" rx="10" />
    <text class="display ok" x="797" y="94" font-size="26" text-anchor="middle">99</text>
    <text class="muted" x="797" y="115" font-size="11" text-anchor="middle">all three agree</text>

    <rect class="card" x="738" y="238" width="118" height="70" rx="10" />
    <text class="display warn" x="797" y="270" font-size="26" text-anchor="middle">26</text>
    <text class="muted" x="797" y="291" font-size="11" text-anchor="middle">references split</text>
  </g>

  <!-- the point -->
  <line class="rule" x1="24" y1="352" x2="856" y2="352" />
  <g class="t">
    <text class="m warn" x="24" y="378" font-size="11" letter-spacing="1.6">THE USEFUL HALF</text>
    <text class="muted" x="24" y="402" font-size="13">Every split is written down in the test suite with the side rxeval follows and why — and the test fails if one stops splitting.</text>
    <text class="m muted" x="24" y="421" font-size="11">A form written against Enketo and run on Collect behaves differently at each of those 26, and nothing in either tool says so.</text>
  </g>
</svg>
