<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
  <title id="t">rxeval: one engine, three targets</title>
  <desc id="d">An XForm and a form instance go into the rxeval engine, which compiles to native code for a server, to WebAssembly for a browser, and to an R package. All three give the same verdict: what is asked, what is calculated, what is missing, what is rejected.</desc>
  <style>
    .bg { fill: #faf6ee; }
    .card { fill: #fffdf8; stroke: #e3dbc9; }
    .core { fill: #fffdf8; stroke: #3b6ea5; stroke-width: 2; }
    .t { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; fill: #1b2a41; }
    .m { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .display { font-family: Fraunces, Georgia, serif; font-weight: 600; }
    .muted { fill: #46587a; }
    .accent { fill: #3b6ea5; }
    .rule { stroke: #e3dbc9; }
    .flow { stroke: #46587a; fill: none; stroke-width: 1.4; }
    .flow-accent { stroke: #3b6ea5; fill: none; stroke-width: 1.8; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #10141d; }
      .card { fill: #161c28; stroke: #2a3347; }
      .core { fill: #161c28; stroke: #82b3e8; }
      .t { fill: #e6ecf5; }
      .muted { fill: #9fadc4; }
      .accent { fill: #82b3e8; }
      .rule { stroke: #2a3347; }
      .flow { stroke: #9fadc4; }
      .flow-accent { stroke: #82b3e8; }
    }
  </style>
  <rect class="bg" width="880" height="400" />

  <!-- inputs -->
  <g class="t">
    <rect class="card" x="24" y="96" width="150" height="52" rx="10" />
    <text class="m" x="99" y="120" font-size="13" text-anchor="middle">form.xml</text>
    <text class="m muted" x="99" y="137" font-size="11" text-anchor="middle">the XForm</text>

    <rect class="card" x="24" y="176" width="150" height="52" rx="10" />
    <text class="m" x="99" y="200" font-size="13" text-anchor="middle">instance</text>
    <text class="m muted" x="99" y="217" font-size="11" text-anchor="middle">the answers</text>
  </g>

  <path class="flow" d="M174 122 C 210 122, 214 162, 250 162" />
  <path class="flow" d="M174 202 C 210 202, 214 180, 250 180" />

  <!-- the engine -->
  <g class="t">
    <rect class="core" x="250" y="86" width="200" height="152" rx="14" />
    <text class="display accent" x="350" y="118" font-size="21" text-anchor="middle">rxeval</text>
    <line class="rule" x1="272" y1="132" x2="428" y2="132" />
    <text class="m muted" x="350" y="153" font-size="11.5" text-anchor="middle">parser · evaluator</text>
    <text class="m muted" x="350" y="172" font-size="11.5" text-anchor="middle">rules · session</text>
    <text class="m muted" x="350" y="191" font-size="11.5" text-anchor="middle">portability</text>
    <text class="m muted" x="350" y="219" font-size="10.5" text-anchor="middle">no dependencies</text>
  </g>

  <!-- three targets -->
  <path class="flow-accent" d="M450 130 C 496 130, 500 74, 548 74" />
  <path class="flow-accent" d="M450 162 C 496 162, 500 162, 548 162" />
  <path class="flow-accent" d="M450 194 C 496 194, 500 250, 548 250" />

  <g class="t">
    <rect class="card" x="548" y="46" width="300" height="56" rx="10" />
    <text x="568" y="70" font-size="14" font-weight="600">native</text>
    <text class="muted" x="568" y="89" font-size="12">a server checking what arrived</text>

    <rect class="card" x="548" y="134" width="300" height="56" rx="10" />
    <text x="568" y="158" font-size="14" font-weight="600">WebAssembly</text>
    <text class="muted" x="568" y="177" font-size="12">a browser filling a form with no signal</text>

    <rect class="card" x="548" y="222" width="300" height="56" rx="10" />
    <text x="568" y="246" font-size="14" font-weight="600">R</text>
    <text class="muted" x="568" y="265" font-size="12">checking a questionnaire before the field</text>
  </g>

  <!-- what comes out -->
  <line class="rule" x1="24" y1="312" x2="856" y2="312" />
  <g class="t">
    <text class="m accent" x="24" y="338" font-size="11" letter-spacing="1.6">THE SAME VERDICT FROM ALL THREE</text>
    <text class="muted" x="24" y="364" font-size="13">what is asked · what the form calculates · what is missing · what it rejects, in its own words</text>
    <text class="m muted" x="24" y="384" font-size="11">one implementation compiled three ways — not three implementations that agree today</text>
  </g>
</svg>
