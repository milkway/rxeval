<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
  <title id="t">rxeval: one engine, four targets</title>
  <desc id="d">An XForm and a form instance go into the rxeval engine, which compiles to native code for a server, to WebAssembly for a browser, to a Python package and to an R package. All four give the same verdict: what is asked, what is calculated, what is missing, what is rejected.</desc>
  <style>
    .bg { fill: #faf6ee; }
    .card { fill: #fffdf8; stroke: #e3dbc9; }
    .core { fill: #fffdf8; stroke: #3b6ea5; stroke-width: 2; }
    .t { font-family: "IBM Plex Sans", "Helvetica Neue", sans-serif; fill: #1b2a41; }
    .m { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .display { font-family: Fraunces, Georgia, serif; font-weight: 600; }
    .muted { fill: #46587a; }
    .accent { fill: #3b6ea5; }
    .rule { stroke: #e3dbc9; }
    .flow { stroke: #46587a; fill: none; stroke-width: 1.4; }
    .flow-accent { stroke: #3b6ea5; fill: none; stroke-width: 1.8; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #10141d; }
      .card { fill: #161c28; stroke: #2a3347; }
      .core { fill: #161c28; stroke: #82b3e8; }
      .t { fill: #e6ecf5; }
      .muted { fill: #9fadc4; }
      .accent { fill: #82b3e8; }
      .rule { stroke: #2a3347; }
      .flow { stroke: #9fadc4; }
      .flow-accent { stroke: #82b3e8; }
    }
  </style>
  <rect class="bg" width="880" height="440" />

  <!-- inputs -->
  <g class="t">
    <rect class="card" x="24" y="116" width="150" height="52" rx="10" />
    <text class="m" x="99" y="140" font-size="13" text-anchor="middle">form.xml</text>
    <text class="m muted" x="99" y="157" font-size="11" text-anchor="middle">the XForm</text>

    <rect class="card" x="24" y="196" width="150" height="52" rx="10" />
    <text class="m" x="99" y="220" font-size="13" text-anchor="middle">instance</text>
    <text class="m muted" x="99" y="237" font-size="11" text-anchor="middle">the answers</text>
  </g>

  <path class="flow" d="M174 142 C 210 142, 214 176, 250 176" />
  <path class="flow" d="M174 222 C 210 222, 214 196, 250 196" />

  <!-- the engine -->
  <g class="t">
    <rect class="core" x="250" y="106" width="200" height="152" rx="14" />
    <text class="display accent" x="350" y="138" font-size="21" text-anchor="middle">rxeval</text>
    <line class="rule" x1="272" y1="152" x2="428" y2="152" />
    <text class="m muted" x="350" y="173" font-size="11.5" text-anchor="middle">parser · evaluator</text>
    <text class="m muted" x="350" y="192" font-size="11.5" text-anchor="middle">rules · session</text>
    <text class="m muted" x="350" y="211" font-size="11.5" text-anchor="middle">portability</text>
    <text class="m muted" x="350" y="239" font-size="10.5" text-anchor="middle">no dependencies</text>
  </g>

  <!-- three targets -->
  <path class="flow-accent" d="M450 134 C 496 134, 500 62, 548 62" />
  <path class="flow-accent" d="M450 160 C 496 160, 500 136, 548 136" />
  <path class="flow-accent" d="M450 200 C 496 200, 500 210, 548 210" />
  <path class="flow-accent" d="M450 228 C 496 228, 500 284, 548 284" />

  <g class="t">
    <rect class="card" x="548" y="34" width="300" height="56" rx="10" />
    <text x="568" y="58" font-size="14" font-weight="600">native</text>
    <text class="muted" x="568" y="77" font-size="12">a server checking what arrived</text>

    <rect class="card" x="548" y="108" width="300" height="56" rx="10" />
    <text x="568" y="132" font-size="14" font-weight="600">WebAssembly</text>
    <text class="muted" x="568" y="151" font-size="12">a browser filling a form with no signal</text>

    <rect class="card" x="548" y="182" width="300" height="56" rx="10" />
    <text x="568" y="206" font-size="14" font-weight="600">Python <tspan class="m muted" font-size="11" font-weight="400">· PyPI</tspan></text>
    <text class="muted" x="568" y="225" font-size="12">the script that builds the form, checking it first</text>

    <rect class="card" x="548" y="256" width="300" height="56" rx="10" />
    <text x="568" y="280" font-size="14" font-weight="600">R <tspan class="m muted" font-size="11" font-weight="400">· extendr</tspan></text>
    <text class="muted" x="568" y="299" font-size="12">a questionnaire read from an analysis script</text>
  </g>

  <!-- what comes out -->
  <line class="rule" x1="24" y1="348" x2="856" y2="348" />
  <g class="t">
    <text class="m accent" x="24" y="374" font-size="11" letter-spacing="1.6">THE SAME VERDICT FROM ALL FOUR</text>
    <text class="muted" x="24" y="400" font-size="13">what is asked · what the form calculates · what is missing · what it rejects, in its own words</text>
    <text class="m muted" x="24" y="420" font-size="11">one implementation compiled four ways — not four implementations that agree today</text>
  </g>
</svg>
