# Its own workspace: R builds this crate from inside the package with
# whatever toolchain the user has, and it must not depend on the layout of
# the repository it happens to live in.
[workspace]

[package]
name = 'rxevalr'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rxevalr'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '*'
# A path dependency while both live in this repo. It becomes a version
# once rxeval is on crates.io, which is what makes this package
# installable from anywhere.
rxeval = { path = '../../../../rxeval' }

[profile.release]
lto = true
codegen-units = 1
