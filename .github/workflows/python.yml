# Wheels for the platforms people actually install on.
#
# Building here produces one wheel for this laptop; PyPI needs Linux,
# macOS on both architectures, and Windows. abi3 means one wheel per
# platform serves every Python from 3.8 up, so the matrix is platforms and
# not platforms × interpreter versions.
#
# Publishing goes through PyPI's trusted publishing: GitHub proves who it is
# with a short-lived OIDC token and no long-lived secret exists anywhere. It
# runs only for a published release, and through an environment, so a push
# cannot reach PyPI on its own.
name: python wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.runner }} · ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64 }
          - { runner: ubuntu-latest,  target: aarch64 }
          # Both macOS targets from the ARM runner: macos-13 was retired and
          # its jobs sit in the queue for ever, which would hold the publish
          # step behind a runner that is not coming. Rust cross-compiles to
          # x86_64-apple-darwin without help, and there is no C here to make
          # that harder than it sounds.
          - { runner: macos-latest,   target: aarch64 }
          - { runner: macos-latest,   target: x86_64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path python/Cargo.toml
          # manylinux for the widest reach; the engine has no C dependencies
          # so the oldest image works and asks nothing of the host.
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Only a published release, never a push. And through an environment, so
    # the repository's settings can require an approval before it runs.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/rxeval/
    permissions:
      # The whole of the credential: a token minted for this run, by GitHub,
      # which PyPI verifies and then forgets. Nothing to leak, nothing to
      # rotate, nothing to put in a secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: what is about to be published
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
